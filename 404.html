<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NFC tag</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --text: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --text: #f5f5f7; --muted: #a1a1a6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 0 16px; text-align: center;
         background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>NFC tag</h1>
  <p>This tag works with an app on its owner's phone. There's nothing to open here.</p>
</main>
</body>
</html>
